<style>
:root{
  --bg:#F5F6F4; --surface:#FFFFFF; --surface-2:#EEF1EF; --ink:#18221F; --ink-2:#4A5753; --ink-3:#7A8783;
  --line:#D9DFDC; --accent:#1E5B63; --accent-soft:#DCEAEA; --on-accent:#FFFFFF;
  --good:#2F7A4B; --good-soft:#DDF0E3; --warn:#9A6A12; --warn-soft:#F6EACB; --bad:#A83A32; --bad-soft:#F6DEDB;
  --radius:10px; --s1:#2a78d6; --s2:#eb6834; --grid:#E3E7E5;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-disp:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121816; --surface:#1A2220; --surface-2:#222C29; --ink:#E6ECEA; --ink-2:#B3BFBB; --ink-3:#83918D;
    --line:#2F3B38; --accent:#6FB3BB; --accent-soft:#1F3538; --on-accent:#0E1715;
    --good:#72C08F; --good-soft:#1C3325; --warn:#E0B458; --warn-soft:#3A2F17; --bad:#EE8A80; --bad-soft:#3D2220;
    --s1:#3987e5; --s2:#d95926; --grid:#2A3431;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1A2220; --surface-2:#222C29; --ink:#E6ECEA; --ink-2:#B3BFBB; --ink-3:#83918D;
  --line:#2F3B38; --accent:#6FB3BB; --accent-soft:#1F3538; --on-accent:#0E1715;
  --good:#72C08F; --good-soft:#1C3325; --warn:#E0B458; --warn-soft:#3A2F17; --bad:#EE8A80; --bad-soft:#3D2220;
  --s1:#3987e5; --s2:#d95926; --grid:#2A3431;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
header.top h1{font-family:var(--f-disp);font-weight:600;font-size:30px;line-height:1.1}
.months{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:7px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:12px}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--ink-3);min-height:18px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--f-num);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--ink-3)}
.tile.key .v{color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 12px;font:inherit;color:var(--ink-2);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600}
.panel h2 small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.checks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.pill{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
.check b{font-weight:600} .check p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-disp);font-size:38px;line-height:1}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:13px}
.track{height:10px;background:var(--surface-2);border-radius:5px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.fill.over{background:var(--bad)} .fill.near{background:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:none}
tfoot td{font-weight:600;background:var(--surface-2)}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.pend{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--good-soft);color:var(--good)}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
input.cell{padding:3px 6px;text-align:right;font-family:var(--f-num);max-width:120px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note{font-size:12px;color:var(--ink-3)}
.flag{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.flag.bad{border-color:var(--bad);background:var(--bad-soft)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px}
.kv .t{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.c1{background:var(--accent)} .c2{background:var(--warn)} .c3{background:var(--good)} .c4{background:var(--ink-3)} .c5{background:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--f-num);font-size:11px}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart rect.bar1{fill:var(--s1)} .chart rect.bar2{fill:var(--s2)}
.chart rect:hover{opacity:.8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12px;padding:3px 8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
nav.sections{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
nav.sections button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
nav.sections button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ver{font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink-3);vertical-align:middle;margin-left:8px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.quick input.big{font-size:22px;font-family:var(--f-num);padding:8px 10px}
.venc{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.venc .d{font-family:var(--f-num);font-size:12px;color:var(--ink-2);min-width:74px}
.venc.over{background:var(--bad-soft)} .venc.soon{background:var(--warn-soft)}
@media (max-width:560px){ .venc{grid-template-columns:1fr auto} .venc .d{grid-column:1/-1} }
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--ink-2)}
@media (max-width:560px){ header.top h1{font-size:24px} .bar{grid-template-columns:1fr auto} .bar .track{grid-column:1 / -1;order:3} }
.catlist{display:flex;flex-direction:column;gap:4px}
.catrow{display:grid;grid-template-columns:minmax(130px,1.1fr) 2fr minmax(120px,auto);gap:6px 12px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
.catrow:hover{background:var(--surface-2)} .catrow.on{border-color:var(--accent);background:var(--accent-soft)}
.catrow .cn{display:flex;flex-direction:column} .catrow .cv{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.catrow .cs{grid-column:1/-1} .catrow .track{height:12px} .catrow .fill{border-radius:0 4px 4px 0}
@media (max-width:560px){ .catrow{grid-template-columns:1fr auto} .catrow .track{grid-column:1/-1;order:3} }
.stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:4px}
.stile .v{font-family:var(--f-num);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.stile .s{font-size:12px;color:var(--ink-3)}
.stile.key .v{color:var(--accent)} .stile.neg .v{color:var(--bad)} .stile.pos .v{color:var(--good)}
.scols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.scol{display:flex;flex-direction:column;gap:16px;min-width:0}
.seg2{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.seg2 button{border:none;background:transparent;border-radius:7px;padding:8px 4px;font:inherit;font-size:13px;color:var(--ink-2);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink-3)}
.dot i{font-style:normal;width:100%;max-width:28px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:1.5px solid var(--line);color:var(--ink-3)}
.dot.ok i{background:var(--good);border-color:var(--good);color:var(--on-accent)} .dot.no i{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)} .dot.curso i{border-color:var(--accent);color:var(--accent)}
.rlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.rlist li{padding-left:22px;position:relative;color:var(--ink-2)} .rlist li::before{content:'○';position:absolute;left:3px;color:var(--ink-3)}
.rlist li.ok{color:var(--ink)} .rlist li.ok::before{content:'✓';color:var(--good);font-weight:700}
.smeta{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)} .smeta:last-child{border-bottom:none}
#sForm > label:first-child{grid-column:1/-1}
.simple .venc .btn{justify-self:end}
@media (max-width:560px){ .simple .venc .btn{grid-column:2} .dots{grid-template-columns:repeat(6,1fr)} .stile .v{font-size:22px} .seg2 button{font-size:12px} }
:root{
  --a-bg:#F4F5F8; --a-card:#FFFFFF; --a-card2:#ECEEF2; --a-ink:#15171B; --a-ink2:#4B5260; --a-ink3:#6F7785; --a-line:#E1E4EA;
  --a-acc:#2a78d6; --a-acc-ink:#FFFFFF; --a-good:#16865A; --a-bad:#C8402F; --a-warn:#9A6A00; --a-shadow:0 6px 24px rgba(20,23,30,.08);
  --g-esencial:#2a78d6; --g-personal:#eb6834; --g-deuda:#1baf7a; --g-evitable:#eda100;
  --a-nexo:#1f46ff; --a-inv:#6250d6;
  --a-font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --a-bg:#14161A; --a-card:#1E2127; --a-card2:#2A2E36; --a-ink:#ECEEF2; --a-ink2:#B0B7C3; --a-ink3:#8A92A0; --a-line:#2F343C;
  --a-acc:#7CC4FF; --a-acc-ink:#0F1720; --a-good:#5FD39A; --a-bad:#FF8577; --a-warn:#F2C14E; --a-shadow:0 8px 30px rgba(0,0,0,.35);
  --g-esencial:#3987e5; --g-personal:#d95926; --g-deuda:#199e70; --g-evitable:#c98500; --a-nexo:#8fa6ff; --a-inv:#9085e9; } }
:root[data-theme="dark"]{ --a-bg:#14161A; --a-card:#1E2127; --a-card2:#2A2E36; --a-ink:#ECEEF2; --a-ink2:#B0B7C3; --a-ink3:#8A92A0; --a-line:#2F343C;
  --a-acc:#7CC4FF; --a-acc-ink:#0F1720; --a-good:#5FD39A; --a-bad:#FF8577; --a-warn:#F2C14E; --a-shadow:0 8px 30px rgba(0,0,0,.35);
  --g-esencial:#3987e5; --g-personal:#d95926; --g-deuda:#199e70; --g-evitable:#c98500; --a-nexo:#8fa6ff; --a-inv:#9085e9; }
body.appmode{background:var(--a-bg);color:var(--a-ink);font-family:var(--a-font)}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px));font-family:var(--a-font);color:var(--a-ink);font-size:15px;line-height:1.45}
#app *{box-sizing:border-box}
#app h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
#app h2{font-size:16px;font-weight:800;margin:0 0 10px}
#app .ah2{margin:0}
#app .sub{color:var(--a-ink3);font-size:13px}
#app .aey{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a-ink3);margin:0 0 4px}
#app b{font-weight:800}
.ahead{position:sticky;top:0;z-index:5;background:var(--a-bg);padding:16px 0 10px;display:flex;flex-direction:column;gap:10px}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.aesp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.aesp button,.achip.btn{flex:none;border:1.5px solid var(--a-line);background:var(--a-card);color:var(--a-ink2);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s}
.aesp button[aria-pressed="true"],.achip.btn[aria-pressed="true"]{background:var(--a-ink);border-color:var(--a-ink);color:var(--a-bg)}
.aesp button:active,.achip.btn:active,.abtn:active,.afab:active{transform:scale(.95)}
.amain{display:flex;flex-direction:column;gap:14px}
.acard{background:var(--a-card);border-radius:24px;padding:18px;box-shadow:var(--a-shadow);animation:aup .35s ease both}
@keyframes aup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ahero{display:flex;flex-direction:column;gap:4px}
.abig{font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.abig.sm{font-size:30px}
.achips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.achips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0;padding-bottom:2px;scrollbar-width:none}
.achip{display:inline-flex;flex-direction:column;gap:1px;background:var(--a-card2);border-radius:16px;padding:8px 12px;font-size:12px;color:var(--a-ink2)}
.achip b{font-size:15px;color:var(--a-ink);font-variant-numeric:tabular-nums}
.achip.neg b{color:var(--a-bad)} .achip.pos b{color:var(--a-good)}
.aalerts{display:flex;flex-direction:column;gap:8px}
.aalert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:16px;background:var(--a-card);border-left:4px solid var(--a-warn);font-size:14px}
.aalert.bad{border-left-color:var(--a-bad)} .aalert span{font-size:20px;line-height:1.2} .aalert p{margin:0}
.abubbles{width:100%;height:auto;max-height:340px;display:block;margin:6px auto 0;overflow:visible}
.bub{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:apop .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0ms);outline:none}
.bub:hover circle,.bub:focus-visible circle{fill-opacity:.38}
.bub text{fill:var(--a-ink);font-family:var(--a-font);font-weight:800;pointer-events:none}
@keyframes apop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.alegend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:12px;color:var(--a-ink2);margin-top:8px}
.alegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.aempty{text-align:center;padding:18px 8px;color:var(--a-ink3)} .aempty span{font-size:40px;display:block} .aempty p{margin:6px 0 0}
.apay{grid-template-columns:auto 1fr auto!important} .apay .aval{gap:6px}
.apay,.amov{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--a-line)}

<script>
(() => {
const fmt = new Intl.NumberFormat('es-EC',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const money = v => (v===null||v===undefined||v==='' || isNaN(v)) ? 'NO DISPONIBLE' : fmt.format(Number(v));
const pct = v => (v===null||!isFinite(v)) ? '—' : (v*100).toFixed(1).replace('.',',')+'%';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesLabel = id => { const [y,m]=id.split('-'); return MESES[+m-1]+' '+y; };
const mesCorto = id => { const [y,m]=id.split('-'); return MESES[+m-1].slice(0,3)+' '+y.slice(2); };
const dmy = s => { if(!s) return 'sin fecha'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+(Number(f(x))||0),0);
const uid = () => Math.random().toString(36).slice(2,10);
const nextId = id => { let [y,m]=id.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; };

const TIPOS = {ingreso:'Ingreso', financiamiento:'Financiamiento recibido', consumo:'Consumo', pago:'Pago de deuda', ahorro:'Ahorro / fondo', transferencia:'Transferencia entre cuentas'};

let db=null, cfg=null, months={}, ledger={historial:[]}, cur=null, sec='hoy', tab='hoy', fTipo='todos', fCat='todas', dlFn=null, editId=null;
const SECS={hoy:[['hoy','Hoy']], mov:[['reg','Registros'],['pres','Presupuesto']], deu:[['deudas','Resumen de deudas'],['tar','Tarjetas'],['porpagar','Por mes de pago'],['prest','Préstamos'],['refi','Adelanto a capital']], aho:[['metas','Metas'],['saldos','Cuentas'],['dist','Reparto']], ana:[['cat','Gastos por categoría'],['eval','Evaluación'],['evo','Evolución'],['revisar','Gastos a revisar']], cfg:[['cfg','Ajustes']]};
const MES_TABS=['reg','pres','tar','dist','eval','revisar'];
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(_){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(_){ } };
const $ = id => document.getElementById(id);
const setStatus = t => { $('status').textContent = t; };

// ---------- writes: one at a time per document
const queues = {};
function save(path, data){
  if(!db){ setStatus('Sin conexión a la base de datos: el cambio no se guardó.'); return Promise.resolve(); }
  const q = queues[path] || Promise.resolve();
  const p = q.then(()=>db.doc(path).set(JSON.parse(JSON.stringify(data,(k,v)=>k.startsWith('_')?undefined:v))))
    .then(()=>{ setStatus('Guardado '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'})); markDirty(); })
    .catch(e=>{ setStatus(e && e.code==='invalid_argument' ? 'Solo lectura: no tiene permiso para guardar cambios.' : 'No se pudo guardar ('+(e&&e.code||'error')+'). Intente de nuevo.'); });
  queues[path]=p; return p;
}
const saveMonth = m => save('months/'+m.mes, m);
const saveCfg = () => save('config/main', cfg);
const saveLedger = () => save('ledger/main', ledger);

// ---------- helpers on config
const cuentas = () => (cfg?.cuentas)||[];
const tarjetas = () => (cfg?.tarjetas)||[];
const cats = () => (cfg?.categorias)||[];
const catById = id => cats().find(c=>c.id===id);
const medioNombre = id => (cuentas().find(c=>c.id===id)||tarjetas().find(t=>t.id===id)||{nombre:id||'—'}).nombre;
const isCard = id => !!tarjetas().find(t=>t.id===id);
const escenario = () => cfg?.escenario ? cfg.escenarios[cfg.escenario] : null;

// ---------- month computations
function calc(m){
  const R = m.registros||[];
  const P = m.presupuesto||[];
  const pres = g => sum(P.filter(l=>l.grupo===g), l=>l.monto);
  const ingresoPres = pres('ingreso');
  const diaCero = pres('compromiso') + pres('esencial') + pres('diferidos');
  const disponible = ingresoPres - diaCero;
  const esc_ = escenario();
  const split = esc_ ? {personal:disponible*esc_.personal, fondo:disponible*esc_.fondo, abono:disponible*esc_.abono} : {personal:disponible, fondo:0, abono:0};
  const byTipo = t => R.filter(r=>r.tipo===t);
  const ingresos = sum(byTipo('ingreso'), r=>r.monto);
  const ingresosHechos = sum(byTipo('ingreso').filter(r=>r.estado==='hecho'), r=>r.monto);
  const financ = sum(byTipo('financiamiento'), r=>r.monto);
  const consumos = byTipo('consumo');
  const catSum = {}; consumos.forEach(r=>{ catSum[r.categoria]=(catSum[r.categoria]||0)+Number(r.monto||0); });
  const grupoSum = g => sum(Object.entries(catSum).filter(([k])=>catById(k)?.grupo===g), ([,v])=>v);
  const consumoNuevo = sum(consumos.filter(r=>catById(r.categoria)?.grupo!=='deuda'), r=>r.monto);
  const personal = grupoSum('personal');
  const esencial = grupoSum('esencial');
  const evitable = grupoSum('evitable');
  const pagos = sum(byTipo('pago'), r=>r.monto);
  const ahorro = sum(byTipo('ahorro'), r=>r.monto);
  const consumoCuenta = sum(consumos.filter(r=>!isCard(r.medio)), r=>r.monto);
  const flujo = ingresos + financ - pagos - ahorro - consumoCuenta;
  const pendientes = R.filter(r=>r.estado==='pendiente');
  const E = m.estados||[];
  const dm = deudaMes(m); const deudaConocida = dm.total; const deudaCompleta = dm.completa;
  return {ingresoPres, diaCero, disponible, split, ingresos, ingresosHechos, financ, consumoNuevo, catSum, personal, esencial, evitable, pagos, ahorro, flujo, pendientes, E, deudaConocida, deudaCompleta};
}

function prevOf(id){ const ids=Object.keys(months).sort(); const i=ids.indexOf(id); return i>0? months[ids[i-1]]:null; }

function evaluate(m){
  const c = calc(m), prev = prevOf(m.mes), pc = prev?calc(prev):null;
  const out = [];
  const add = (st,t,d)=>out.push({st,t,d});
  // 1 cobertura
  if(c.ingresoPres>0){
    const ratio=c.diaCero/c.ingresoPres;
    add(ratio<=0.85?'good':ratio<=1?'warn':'bad','El ingreso cubre el mínimo de supervivencia',`Día Cero ${money(c.diaCero)} = ${pct(ratio)} del ingreso presupuestado (${money(c.ingresoPres)}). Disponible: ${money(c.disponible)}.`);
  } else add('na','El ingreso cubre el mínimo de supervivencia','Falta el presupuesto de ingresos del mes.');
  // 2 esenciales por categoría
  const esen = cats().filter(k=>k.grupo==='esencial' && k.tope>0);
  const over = esen.filter(k=>(c.catSum[k.id]||0)>k.tope*1.0001);
  add(over.length? 'bad' : esen.some(k=>(c.catSum[k.id]||0)>k.tope*0.9)?'warn':'good','Gastos esenciales dentro de sus topes',
    over.length? 'Superaron el tope: '+over.map(k=>`${k.nombre} ${money(c.catSum[k.id])} de ${money(k.tope)}`).join('; ')+'.' : `Esenciales registrados: ${money(c.esencial)}.`);
  // 3 personal
  const topeP = c.split.personal;
  add(c.personal<=topeP*0.9?'good':c.personal<=topeP?'warn':'bad','Gasto personal dentro del disponible',
    `Registrado ${money(c.personal)} frente a ${money(topeP)} disponibles para gastar${cfg.escenario?` (escenario ${cfg.escenario})`:' (sin escenario elegido: se usa todo el disponible)'}.`);
  // 4 evitables
  add(c.evitable===0?'good':c.evitable<20?'warn':'bad','Sin intereses, tarifas ni avances',
    c.evitable===0?'No se registraron cargos financieros ni avances.':`Cargos financieros y avances: ${money(c.evitable)}.`);
  // 5 tarjetas
  if(c.E.length){
    const mora = c.E.filter(e=>(e.interesMora||0)>0);
    const minimo = c.E.filter(e=>typeof e.pagado==='number' && e.pagado < e.total-0.005);
    const sinPago = c.E.filter(e=>e.pagado===null||e.pagado===undefined);
    let st='good', d=[];
    if(mora.length){ st='bad'; d.push(`Interés de mora en ${mora.length} tarjeta(s): `+mora.map(e=>medioNombre(e.tarjeta)).join(', ')); }
    if(minimo.length){ st='bad'; d.push(`Pago menor al total en: `+minimo.map(e=>medioNombre(e.tarjeta)).join(', ')); }
    if(sinPago.length){ if(st==='good') st='warn'; d.push(`${sinPago.length} estado(s) sin pago registrado`); }
    add(st,'Tarjetas pagadas por el total y a tiempo', d.length? d.join('. ')+'.' : 'Todos los estados del mes pagados por el total.');
  } else add('na','Tarjetas pagadas por el total y a tiempo','No hay estados de cuenta registrados en este mes.');
  // 6 fondo
  const plan = c.split.fondo;
  if(plan>0) add(c.ahorro>=plan-0.005?'good':c.ahorro>0?'warn':'bad','Aporte al fondo de emergencia',`Aportado ${money(c.ahorro)} de ${money(plan)} planificados.`);
  else add(c.ahorro>0?'good':'na','Aporte al fondo de emergencia', c.ahorro>0?`Aportado ${money(c.ahorro)}.`:'Sin aporte planificado (elija un escenario en Parámetros).');
  // 7 deuda
  if(pc){
    const d = c.deudaConocida - pc.deudaConocida;
    add(d<-0.005?'good':Math.abs(d)<=0.005?'warn':'bad','La deuda conocida bajó frente al mes anterior',`${money(pc.deudaConocida)} → ${money(c.deudaConocida)} (${d>0?'+':''}${money(d)}).${(m.saldos?.proyectado)?' Saldos de este mes proyectados, no confirmados.':''}`);
  } else add('na','La deuda conocida bajó frente al mes anterior','Primer mes registrado: es la línea base.');
  // 8 pendientes
  add(c.pendientes.length===0?'good':'warn','Movimientos pendientes', c.pendientes.length? `${c.pendientes.length} movimiento(s) por confirmar, ${money(sum(c.pendientes,r=>r.monto))}.` : 'Todo confirmado.');
  return out;
}

function tasaImplicita(saldo,n,cuota){ if(!(saldo>0&&n>0&&cuota>0)) return null; if(cuota*n<=saldo+0.01) return 0;
  const f=r=>saldo - cuota*(1-Math.pow(1+r,-n))/r; let lo=1e-9, hi=0.2; for(let i=0;i<200;i++){ const mid=(lo+hi)/2; if(f(mid)>0) hi=mid; else lo=mid; } return (lo+hi)/2; }
function simularPagos(saldo,r,cuota){ let s_=saldo, n=0, tot=0; while(s_>0.005 && n<600){ const i=s_*r; const pago=Math.min(cuota, s_+i); s_=s_+i-pago; tot+=pago; n++; } return {n, total:tot, ultima: n? tot-cuota*(n-1) : 0}; }
function calcAdelanto(a){
  const saldo=+a.saldo, n=Math.round(+a.cuotas), cuota=+a.cuota, abono=+a.abono||0;
  const r=tasaImplicita(saldo,n,cuota); if(r===null) return null;
  const base={total:cuota*n, interes:cuota*n-saldo};
  const s2=saldo-abono; if(s2<=0.005) return {r, base, liquida:true, sobra:-s2};
  const cA = r>0? s2*r/(1-Math.pow(1+r,-n)) : s2/n;
  const A={cuota:cA, n, total:cA*n, interes:cA*n-s2}; A.ahorro=base.interes-A.interes; A.libera=cuota-cA;
  const sim= r>0? simularPagos(s2,r,cuota) : {n:Math.ceil(s2/cuota), total:s2, ultima:s2-cuota*(Math.ceil(s2/cuota)-1)};
  const B={cuota, n:sim.n, ultima:sim.ultima, total:sim.total, interes:sim.total-s2}; B.ahorro=base.interes-B.interes; B.menos=n-sim.n;
  return {r, base, A, B, s2};
}

// ---------- ciclos de tarjeta
const addM = (id,n)=>{ let [y,m]=id.split('-').map(Number); m+=n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${String(m).padStart(2,'0')}`; };
function cicloDe(card, fecha){ // mes de corte y mes de pago de un consumo
  const d=+fecha.slice(8,10), mes=fecha.slice(0,7);
  const corteMes = d<=card.diaCorte ? mes : addM(mes,1);
  const pagoMes = card.diaPago>card.diaCorte ? corteMes : addM(corteMes,1);
  return {corteMes, pagoMes};
}
function ultimoCorte(cardId){
  let c=null; Object.values(months).forEach(m=>(m.estados||[]).forEach(e=>{ if(e.tarjeta===cardId && (!c||e.corte>c)) c=e.corte; })); return c;
}
function estadosPorPagoMes(cardId, pagoMes){
  const out=[]; Object.values(months).forEach(m=>(m.estados||[]).forEach(e=>{ if(e.tarjeta===cardId && (e.fechaPago||'').slice(0,7)===pagoMes) out.push(e); })); return out;
}
function consumosSinFacturar(cardId){
  const card=tarjetas().find(t=>t.id===cardId); const lc=ultimoCorte(cardId)||'0000';
  const out=[]; Object.values(months).forEach(m=>(m.registros||[]).forEach(r=>{
    if(r.tipo==='consumo' && r.medio===cardId && r.fecha && r.fecha>lc && catById(r.categoria)?.grupo!=='deuda') out.push({...r, ...cicloDe(card, r.fecha)}); }));
  return out;
}

// ================= NÚCLEO v1.0: saldos, deudas y vínculos derivados
const nowTs=()=>new Date().toISOString();
const addD=(iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function allRegsM(){ const out=[]; Object.values(months).forEach(m=>(m.registros||[]).forEach(r=>out.push({r,m}))); return out; }
const allRegs=()=>allRegsM().map(x=>x.r);
const mesActivo=()=>{ const ids=Object.keys(months).sort(); return ids.find(i=>months[i].estado!=='cerrado')||ids[ids.length-1]||null; };
function regsVigentesM(){ const ma=mesActivo(); return allRegsM().filter(x=>!ma || x.m.mes<=ma); }
function efecto(r,k){ const v=Number(r.monto)||0;
  switch(r.tipo){
    case 'ingreso': case 'financiamiento': return r.medio===k? v:0;
    case 'pago': return r.medio===k? -v:0;
    case 'consumo': return (!isCard(r.medio) && r.medio===k)? -v:0;
    case 'transferencia': case 'ahorro': { const o=r.origen||(r.tipo==='ahorro'?'guayaquil':null); return (r.medio===k?v:0)-(o===k?v:0); }
  } return 0; }
function ultimoConf(tipo,k){ const H=(ledger.historial||[]).filter(h=>h.tipo===tipo&&h.clave===k).slice().sort((a,b)=>(a.fecha+a.ts).localeCompare(b.fecha+b.ts)); return H[H.length-1]||null; }
function saldoCuenta(k){ const c=ultimoConf('cuenta',k); if(!c) return {conf:null, saldo:null, mov:0};
  let v=c.monto, n=0; allRegs().forEach(r=>{ if(r.estado==='hecho' && r.hechoTs && r.hechoTs>c.ts){ const e=efecto(r,k); if(e){ v+=e; n++; } } });
  return {conf:c, saldo:Math.round(v*100)/100, mov:n}; }
function pendCuenta(k){ let inn=0,out=0; regsVigentesM().map(x=>x.r).forEach(r=>{ if(r.estado!=='pendiente') return; const e=efecto(r,k); if(e>0) inn+=e; else out-=e; }); return {inn,out}; }
function estadosTodos(){ const out=[]; Object.values(months).forEach(m=>(m.estados||[]).forEach(e=>out.push({e,m}))); return out; }
function deudaTarjeta(id){ const L=estadosTodos().filter(x=>x.e.tarjeta===id).sort((a,b)=>a.e.corte.localeCompare(b.e.corte)); const last=L[L.length-1];
  const pend0=sum(L,x=>{ const v=(x.e.total||0)-(x.e.pagado||0); return v>=0.05? v:0; });
  const dif0= last? Math.max(0,(last.e.diferidos||0)-(last.e.abonoDiferidos||0)) : 0;
  const SF=consumosSinFacturar(id); const esDif=r=>catById(r.categoria)?.grupo==='diferida';
  const dif=dif0+sum(SF.filter(esDif), r=>r.monto); const hoy_=hoyISO(); const norm=SF.filter(r=>!esDif(r) && (r.estado==='hecho' || (r.fecha||'')<=hoy_));
  const conf=ultimoConf('tarjeta',id);
  if(conf && (!last || conf.fecha>=last.e.corte)){
    const desp=r=> r.hechoTs? r.hechoTs>conf.ts : (r.fecha||'')>conf.fecha;
    const nuevos=sum(norm.filter(desp), r=>r.monto);
    const pagos=sum(allRegs().filter(r=>r.tipo==='pago'&&r.estado==='hecho'&&r.vinculo&&r.vinculo.tipo==='tarjeta'&&r.vinculo.id===id&&!r.aplicado&&r.hechoTs&&r.hechoTs>conf.ts), r=>r.monto);
    const corr=Math.max(0, Math.round((conf.monto+nuevos-pagos)*100)/100);
    return {pend:0, dif, sinF:corr, total:corr+dif, last:last?last.e:null, conf}; }
  const sinF=sum(norm, r=>r.monto);
  return {pend:pend0, dif, sinF, total:pend0+dif+sinF, last:last?last.e:null, conf:null}; }
function proximoMesCuota(p){ const h=hoyISO().slice(0,7); if(p.primeraCuota && p.primeraCuota>h) return p.primeraCuota; const d=+hoyISO().slice(8); return (p.diaPago && d>p.diaPago)? addM(h,1) : h; }
function prestamoEstado(p){
  const R=allRegs().filter(r=>r.vinculo && r.vinculo.tipo==='prestamo' && r.vinculo.id===p.id);
  const pagos=R.filter(r=>r.tipo==='pago' && r.estado==='hecho' && r.hechoTs).sort((a,b)=>a.hechoTs.localeCompare(b.hechoTs));
  const desemb=R.find(r=>r.tipo==='financiamiento' && r.estado==='hecho');
  const activo=!p.requiereDesembolso || !!desemb;
  const conf=ultimoConf('deuda',p.id);
  let saldo = conf? conf.monto : (typeof p.monto==='number'? p.monto : null);
  const desde = conf? pagos.filter(r=>r.hechoTs>conf.ts) : pagos;
  const tm=(p.tasaAnual||0)/12;
  const esCuota = x => typeof p.cuota==='number' && x.monto>=p.cuota*0.9 && x.monto<=p.cuota*1.5;
  if(saldo!==null) desde.forEach(x=>{ saldo = esCuota(x)? Math.max(0, saldo*(1+tm)-x.monto) : Math.max(0, saldo-x.monto); });
  const cuotasHechas = desde.filter(esCuota).length;
  const pagadas=(p.cuotasPagadasBase||0)+cuotasHechas;
  const faltan = typeof p.cuotasTotal==='number'? Math.max(0,p.cuotasTotal-pagadas) : (saldo!==null && typeof p.cuota==='number' && p.cuota>0? Math.ceil(saldo/p.cuota-1e-9) : null);
  const fin = faltan===null? null : faltan===0? null : addM(proximoMesCuota(p), faltan-1);
  return {activo, saldo: saldo===null?null:Math.round(saldo*100)/100, pagadas, faltan, fin, pagos, conf, desemb};
}
function deudaActual(){
  const T=tarjetas().map(t=>({t,...deudaTarjeta(t.id)}));
  const P=(cfg.prestamos||[]).map(p=>({p,...prestamoEstado(p)}));
  const tt=sum(T,x=>x.total); const act=P.filter(x=>x.activo);

  else target.e.abonoDiferidos=Math.round(((target.e.abonoDiferidos||0)+Number(r.monto))*100)/100;

  return target.m;
}

  if(a.tipo==='tarjeta'){ e.pagado=Math.round(((e.pagado||0)-a.monto)*100)/100; if(e.pagado<=0.004){ e.pagado=null; e.fechaPagado=null; } }
  else e.abonoDiferidos=Math.max(0,Math.round(((e.abonoDiferidos||0)-a.monto)*100)/100);
  return m; }

function vencimientos(){
  const hoy=hoyISO(); const L=[];
  const regsPend=regsVigentesM().filter(x=>x.r.estado==='pendiente'); const usados=new Set();
  estadosTodos().forEach(({e})=>{ const pend=Math.max(0,(e.total||0)-(e.pagado||0)); if(pend<0.05||!e.fechaPago) return;
    const reg=regsPend.find(x=>x.r.vinculo&&x.r.vinculo.tipo==='tarjeta'&&x.r.vinculo.id===e.tarjeta); if(reg) usados.add(reg.r.id);
    L.push({fecha:e.fechaPago, que:'Tarjeta '+medioNombre(e.tarjeta), det:'Total facturado del corte '+dmy(e.corte), monto:pend, rid:reg?reg.r.id:null, tarjeta:e.tarjeta}); });
  regsPend.forEach(({r})=>{ if(!['pago','transferencia','ahorro'].includes(r.tipo)) return; if(r.vinculo&&r.vinculo.tipo==='tarjeta'&&usados.has(r.id)) return;

  (cfg.prestamos||[]).forEach(p=>{ const st=prestamoEstado(p); if(!st.activo||!p.diaPago||typeof p.cuota!=='number'||st.faltan===0) return;

}

function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=()=>rej(new Error('No se pudo cargar el lector de PDF')); document.head.appendChild(sc); }); }
async function pdfText(file){
  const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsWorker) await loadScript(B+'pdf.worker.min.js');
  if(!window.pdfjsLib) await loadScript(B+'pdf.min.js');
  const doc = await window.pdfjsLib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let out='';
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent(); let lastY=null, line=[];
    tc.items.forEach(it=>{ const y=Math.round(it.transform[5]); if(lastY!==null && Math.abs(y-lastY)>2){ out+=line.join(' ').replace(/\s+/g,' ').trim()+'\n'; line=[]; } line.push(it.str); lastY=y; });
    out+=line.join(' ').replace(/\s+/g,' ').trim()+'\n--- página '+i+' ---\n';
  }
  return out.replace(/\n{2,}/g,'\n');
}

Categorías posibles para movimientos: ${catsTxt}.
Reglas: "total" = total a pagar del período; "minimo" = pago mínimo; "diferidos" = saldo de diferidos pendientes (saldos y diferidos pendientes / saldo diferido); "cupo" = cupo total o cupo global; "cupoUtilizado" = cupo utilizado; "interesMora" = interés de mora del período; "cargos" = suma de intereses, tarifas, IVA de tarifas, gestión de cobranza y costos de avance del período; "avances" = número de avances de efectivo más transferencias de rotativo a diferido. En "movimientos" incluye cada consumo, cuota de diferido y cargo del período (no los pagos ni créditos), con la categoría más adecuada (cuotas de diferido = "diferidos", intereses/tarifas/IVA de tarifas = "cargos", avances = "avances"). Si un dato no aparece usa null.

TEXTO DEL PDF:
${txt}`;

    const est={tarjeta:e.tarjeta, corte:e.corte, fechaPago:e.fechaPago||null, total:e.total, minimo:e.minimo??null, diferidos:e.diferidos??0, cupo:e.cupo??null, cupoUtilizado:e.cupoUtilizado??null, interesMora:e.interesMora||0, cargos:e.cargos||0, avances:e.avances||0, pagado:null, fechaPagado:null};
    m.estados=(m.estados||[]).filter(x=>!(x.tarjeta===est.tarjeta && x.corte===est.corte)).concat([est]);
    if(imp.conMov) (e.movimientos||[]).forEach(v=>{ if(typeof v.monto==='number') m.registros=(m.registros||[]).concat([{id:uid(), fecha:v.fecha||'', tipo:'consumo', concepto:String(v.concepto||'Movimiento'), categoria: catById(v.categoria)? v.categoria : 'otros', medio:e.tarjeta, monto:v.monto, estado:'hecho', nota:'Importado del estado de cuenta'}]); });

// ================= EVOLUCIÓN (gráficos)
function barChart(labels, series, opts={}){
  const W=640,H=220,pl=62,pr=12,pt=14,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const max=Math.max(1,...series.flatMap(s=>s.values.map(v=>v||0)));
  const step=Math.pow(10,Math.floor(Math.log10(max))); const nice=[1,2,2.5,5,10].map(k=>k*step).find(k=>max/k<=5)||step*10;
  const top=Math.ceil(max/nice)*nice; const y=v=>pt+ih-(v/top)*ih;
  const gw=iw/labels.length; const n=series.length; const bw=Math.min(34,(gw-14)/n);
  let g='';
  for(let v=0; v<=top+1e-9; v+=nice){ g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt.format(v).replace(',00','')}</text>`; }
  labels.forEach((lab,i)=>{
    const cx=pl+gw*i+gw/2; const x0=cx-(bw*n+2*(n-1))/2;
    series.forEach((s,j)=>{ const v=s.values[i]; if(v===null||v===undefined) return; const h=Math.max(0,y(0)-y(v)); const x=x0+j*(bw+2);
      g+=`<rect class="${s.cls}" x="${x}" y="${y(v)}" width="${bw}" height="${h}" rx="3"><title>${esc(s.name)} · ${esc(lab)}: ${money(v)}</title></rect>`;
      if(n===1 || labels.length<=4) g+=`<text x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle">${fmt.format(v).replace(/,\d\d$/,'')}</text>`; });
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'')}">${g}</svg>`;
}

function normConcepto(c){ return String(c||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/[0-9*#]+/g,' ').replace(/\b(ecua|s a|sa|cia|ltda)\b/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,2).join(' ') || 'otros'; }
function hormigaDe(m){

  return {lim, total:sum(R,r=>r.monto), n:R.length, grupos:Object.values(g).sort((a,b)=>b.t-a.t)};
}

function aportesMeta(id){ let t=0; Object.values(months).forEach(m=>(m.registros||[]).forEach(r=>{ if(r.tipo==='ahorro' && r.meta===id && r.estado==='hecho') t+=Number(r.monto)||0; })); return t; }
function austroTerminado(){ const p=(cfg.prestamos||[]).find(x=>x.id==='austro'); if(!p||!p.primeraCuota||!p.cuotasTotal) return false; return (cur||hoyISO().slice(0,7)) > addM(p.primeraCuota,p.cuotasTotal-1); }
function planAhorro(){
  const m=months[cur]; const c=m?calc(m):null;
  const base = c? c.split.fondo + (austroTerminado()? c.split.abono : 0) : 0;
  const cortes = sum((cfg.suscripciones||[]).filter(x=>x.decision==='cortar'),x=>x.monto);
  return {base, cortes, total: base+cortes, personal: c? c.split.personal : 0};
}
const mesesEntre = (a,b) => (Number(b.slice(0,4))-Number(a.slice(0,4)))*12 + Number(b.slice(5,7))-Number(a.slice(5,7));
function repartoMetas(){
  const M=cfg.metas||[]; const P=planAhorro();
  const acum = x => (Number(x.saldoInicial)||0)+aportesMeta(x.id);
  const act = M.filter(x=>acum(x)<x.meta);
  const mA=(typeof mesActivo==='function'?mesActivo():mesActivo)||hoyISO().slice(0,7);
  const fijas = act.filter(x=>typeof x.cuotaFija==='number' && x.cuotaFija>0 && (!x.desde || mA>=x.desde));
  const comprom = sum(fijas, x=>Math.min(x.cuotaFija, x.meta-acum(x)));
  let libre = Math.max(0, P.total - comprom);
  const r={}; fijas.forEach(x=>r[x.id]=Math.min(x.cuotaFija, x.meta-acum(x)));
  const variables = act.filter(x=>!fijas.includes(x));
  const prio = variables.slice().sort((a,b)=>a.prioridad-b.prioridad)[0];
  if(prio && prio.exclusiva){ r[prio.id]=libre; }
  else { const tp=sum(variables,x=>x.pct||0)||1; variables.forEach(x=>r[x.id]=libre*(x.pct||0)/tp); }
  return {r, P, comprom, libre, acum};
}
let nm={nombre:'', monto:'', modo:'cuota', cuota:'', fecha:'', cuenta:'guayaquil'};
function recomendar(nmx){
  const monto=parseFloat(nmx.monto); if(!(monto>0)) return null;
  const hoyM=hoyISO().slice(0,7); const R=repartoMetas();
  let meses, cuota;
  if(nmx.modo==='cuota'){ cuota=parseFloat(nmx.cuota); if(!(cuota>0)) return null; meses=Math.ceil(monto/cuota); }
  else { if(!nmx.fecha) return null; meses=Math.max(1, mesesEntre(hoyM, nmx.fecha)); cuota=Math.ceil(monto/meses*100)/100; }
  const fin=addM(hoyM, meses);
  const cap=R.P.total - R.comprom; // capacidad aún no comprometida en cuotas fijas
  return {monto, meses, cuota, fin, cap, exceso: cuota-cap, pctPersonal: R.P.personal>0? cuota/R.P.personal : null, ultima: Math.round((monto-cuota*(meses-1))*100)/100};
}

function packCircles(items, gap){ const P=[];
  for(const c of items){ if(!P.length){ c.x=0; c.y=0; P.push(c); continue; }
    const cand=[];
    for(const a of P){ const d=a.r+c.r+gap; for(let k=0;k<16;k++){ const t=k/16*2*Math.PI; cand.push([a.x+d*Math.cos(t), a.y+d*Math.sin(t)]); }
      for(const b of P){ if(b===a) continue; const ra=a.r+c.r+gap, rb=b.r+c.r+gap, dx=b.x-a.x, dy=b.y-a.y, dd=Math.hypot(dx,dy); if(!dd || dd>ra+rb || dd<Math.abs(ra-rb)) continue;

    let best=null, bd=Infinity; for(const [x,y] of cand){ if(P.every(p=>Math.hypot(p.x-x,p.y-y)>=p.r+c.r+gap-.01)){ const s=Math.hypot(x*.75,y*1.25); if(s<bd){ bd=s; best=[x,y]; } } }

async function dataFromCode(text){ const m=String(text||'').replace(/\s+/g,'').match(/MF1:([A-Za-z0-9+\/=]+)/); if(!m) throw new Error('sin código');

function localDB(){ const P='mf:'; const subs={doc:{},col:{}};

  const colSnap=c=>({docs:keys().filter(x=>x.startsWith(c+'/')).map(x=>snap(x,rd(x)))});
  const emit=k=>{ (subs.doc[k]||[]).forEach(f=>f(snap(k,rd(k)))); const c=k.split('/')[0]; (subs.col[c]||[]).forEach(f=>f(colSnap(c))); };

function recompensa(){ const R=cfg.recompensa; if(!R) return null; const ma=mesActivo();
  const slots=[]; for(let i=0;i<(R.meses||12);i++){ const id=addM(R.desde,i); const m=months[id];
    let st='pend', det='Aún no llega';
    if(m && (id<ma || m.estado==='cerrado')){ const c=mesCumple(m); st=c.ok?'ok':'no'; det=c.ok?'Cumplido':c.mot.join('; '); }
    else if(m && id===ma){ const c=mesCumple(m); st='curso'; det='En curso: '+(c.ok?'va bien':c.mot.join('; ')); }
    slots.push({id,st,det}); }
  let racha=0; for(const s of slots){ if(s.st==='ok') racha++; else if(s.st==='no') racha=0; else break; }
  const fm=(cfg.metas||[]).find(x=>x.id==='fondo'); const fondoAcum=fm?(Number(fm.saldoInicial)||0)+aportesMeta('fondo'):0; const fondoOk=fm? fondoAcum>=fm.meta-0.005 : false;
  const mm=(cfg.metas||[]).find(x=>x.id===R.metaId); const ahorro=mm?(Number(mm.saldoInicial)||0)+aportesMeta(mm.id):0;
  return {R, slots, racha, fondoOk, fondoAcum, fm, ahorro, mm, desbloqueada: racha>=(R.meses||12) && fondoOk}; }

// ================= GASTOS POR CATEGORÍA (vista dinámica)
let catPer=null, catMedio='todos', catDif=false, catSel=null;
const comercio = s => String(s||'').toUpperCase().replace(/\(.*?\)/g,'').replace(/[*#].*$/,'').replace(/\d{3,}.*$/,'').replace(/\s+/g,' ').trim() || 'SIN NOMBRE';
const GRUPO_TXT={esencial:'Esencial',personal:'Personal',evitable:'Evitable',deuda:'Cuota de diferido',diferida:'Compra en cuotas'};
function consumosPeriodo(ids){
  const out=[]; ids.forEach(id=>{ const m=months[id]; if(!m) return; (m.registros||[]).forEach(r=>{ if(r.tipo!=='consumo') return;
    const g=catById(r.categoria)?.grupo; if(g==='deuda' && !catDif) return;
    if(catMedio==='tarjetas' && !isCard(r.medio)) return; if(catMedio==='cuentas' && isCard(r.medio)) return;
    if(!['todos','tarjetas','cuentas'].includes(catMedio) && r.medio!==catMedio) return;
    out.push({r, mes:id}); }); });
  return out; }
function agrupar(L){ const g={}; L.forEach(({r})=>{ const k=r.categoria||'otros'; (g[k]=g[k]||{id:k,total:0,n:0}); g[k].total+=Number(r.monto)||0; g[k].n++; }); return Object.values(g).sort((a,b)=>b.total-a.total); }
function viewCat(){
  const ids=Object.keys(months).sort().filter(id=>(months[id].registros||[]).some(r=>r.tipo==='consumo'));
  if(!ids.length) return '<div class="panel empty">Aún no hay gastos registrados. Use Hoy → Registrar un gasto.</div>';
  const opts=ids.map(id=>[id,mesCorto(id)]).concat(ids.length>1?[['ult3','Últimos 3 meses']]:[]);
  if(!catPer || !opts.some(o=>o[0]===catPer)) catPer=ids[ids.length-1];
  const sel = catPer==='ult3'? ids.slice(-3) : [catPer];
  const nMeses = sel.length;
  const L=consumosPeriodo(sel); const G=agrupar(L); const total=sum(G,x=>x.total);
  const prevId = catPer==='ult3'? null : ids[ids.indexOf(catPer)-1];
  const Gp = prevId? agrupar(consumosPeriodo([prevId])) : null; const prevOfCat = k => Gp? ((Gp.find(x=>x.id===k)||{}).total||0) : null;
  const totPrev = Gp? sum(Gp,x=>x.total) : null;
  const max = Math.max(1, ...G.map(x=>x.total));
  const lim=cfg.umbralHormiga??15; const hormiga=sum(L.filter(({r})=>catById(r.categoria)?.grupo==='personal' && r.monto<=lim), x=>x.r.monto);
  const top=G[0];
  const medios=[['todos','Todos los medios'],['tarjetas','Solo tarjetas'],['cuentas','Solo cuentas y efectivo']].concat(tarjetas().map(t=>[t.id,'Tarjeta '+t.nombre]),cuentas().map(k=>[k.id,k.nombre]));
  const delta=(a,b)=>{ if(b===null) return ''; const d=a-b; if(Math.abs(d)<0.5) return '<span class="note">igual que el mes anterior</span>'; return `<span class="note">${d>0?'▲ subió':'▼ bajó'} ${money(Math.abs(d))}</span>`; };
  const rows=G.map(x=>{ const k=catById(x.id)||{nombre:x.id,grupo:'personal'}; const w=x.total/max*100; const p=total? x.total/total : 0;
    const tope = (k.grupo==='esencial'||k.grupo==='evitable') && k.tope>0 ? k.tope*nMeses : null;
    const over = tope!==null && x.total>tope+0.005; const evit = k.grupo==='evitable';
    const estado = over? `<span class="pill bad">SUPERA EL TOPE en ${money(x.total-tope)}</span>` : evit? '<span class="pill bad">EVITABLE</span>' : tope!==null? `<span class="pill good">DENTRO DEL TOPE (${money(tope)})</span>`:'';
    return `<button type="button" class="catrow${catSel===x.id?' on':''}" data-catsel="${esc(x.id)}" aria-pressed="${catSel===x.id}" title="${esc(k.nombre)}: ${money(x.total)} · ${x.n} movimiento(s) · ${pct(p)} del total">
      <span class="cn"><b>${esc(k.nombre)}</b><span class="note">${GRUPO_TXT[k.grupo]||k.grupo} · ${x.n} mov.</span></span>
      <span class="track"><span class="fill${over||evit?' over':''}" style="width:${w.toFixed(1)}%"></span></span>
      <span class="cv"><span class="num"><b>${money(x.total)}</b> <span class="faint">${pct(p)}</span></span>${delta(x.total, prevOfCat(x.id))}</span>
      ${estado?`<span class="cs">${estado}</span>`:''}</button>`; }).join('');
  // detalle de la categoría elegida
  let det='';
  if(catSel && G.some(x=>x.id===catSel)){
    const k=catById(catSel)||{nombre:catSel}; const M=L.filter(({r})=>(r.categoria||'otros')===catSel).sort((a,b)=>(b.r.fecha||'').localeCompare(a.r.fecha||''));
    const com={}; M.forEach(({r})=>{ const c=comercio(r.concepto); (com[c]=com[c]||{c,t:0,n:0}); com[c].t+=Number(r.monto)||0; com[c].n++; });
    const C=Object.values(com).sort((a,b)=>b.t-a.t);
    const catOpts = id => cats().map(c=>`<option value="${c.id}"${c.id===id?' selected':''}>${esc(c.nombre)}</option>`).join('');
    det=`<section class="panel"><div class="row" style="justify-content:space-between"><h2>${esc(k.nombre)} <small>${money(sum(M,x=>x.r.monto))} en ${M.length} movimiento(s)</small></h2><button class="btn ghost small" type="button" data-catsel="">Cerrar detalle</button></div>
      <h3 class="eyebrow">Dónde gasta más</h3>
      <div class="tablewrap"><table><thead><tr><th>Comercio</th><th class="r">Veces</th><th class="r">Total</th><th class="r">Promedio</th></tr></thead><tbody>${C.slice(0,8).map(x=>`<tr><td>${esc(x.c)}</td><td class="r num">${x.n}</td><td class="r num">${money(x.t)}</td><td class="r num">${money(x.t/x.n)}</td></tr>`).join('')}</tbody></table></div>
      <h3 class="eyebrow">Movimientos <span class="note" style="text-transform:none;letter-spacing:0">· cambie la categoría si está mal clasificado</span></h3>
      <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Pagó con</th><th class="r">Monto</th><th>Categoría</th></tr></thead><tbody>${M.map(({r,mes})=>`<tr><td class="num">${dmy(r.fecha)}</td><td>${esc(r.concepto)}${r.nota?`<div class="note">${esc(r.nota)}</div>`:''}</td><td>${esc(medioNombre(r.medio))}</td><td class="r num">${money(r.monto)}</td><td><select data-recat="${r.id}" data-recmes="${mes}" aria-label="Categoría de ${esc(r.concepto)}">${catOpts(r.categoria)}</select></td></tr>`).join('')}</tbody></table></div></section>`;
  }
  // dónde moderarse
  const GRANDE=300; const grandes=L.filter(({r})=>catById(r.categoria)?.grupo==='personal' && r.monto>=GRANDE);
  const pers=agrupar(L.filter(({r})=>catById(r.categoria)?.grupo==='personal' && r.monto<GRANDE)); const evs=G.filter(x=>catById(x.id)?.grupo==='evitable');
  const recorte=sum(pers.slice(0,3),x=>x.total*0.25)/nMeses + sum(evs,x=>x.total)/nMeses;
  const consejo=`<section class="panel"><h2>Dónde moderarse</h2>
    ${pers.length||evs.length?`<ul class="checks">${evs.map(x=>`<li class="check"><span class="pill bad">CORTAR</span><div><b>${esc(catById(x.id).nombre)}: ${money(x.total/nMeses)} al mes</b><p>Es un gasto evitable: llevarlo a cero libera todo ese dinero.</p></div></li>`).join('')}
    ${pers.slice(0,3).map(x=>`<li class="check"><span class="pill warn">BAJAR 25%</span><div><b>${esc(catById(x.id).nombre)}: ${money(x.total/nMeses)} al mes</b><p>Un tope de ${money(x.total/nMeses*0.75)} al mes ahorraría ${money(x.total/nMeses*0.25)}.</p></div></li>`).join('')}</ul>
    <div class="flag" style="border-color:var(--good);background:var(--good-soft)">Con esos ajustes liberaría unos <b>${money(recorte)}</b> al mes${hormiga?`, y los gastos hormiga (hasta ${money(lim)}) suman ${money(hormiga/nMeses)} al mes`:''}.</div>`
    :'<p class="note">No hay gastos personales ni evitables en este período.</p>'}
    ${grandes.length?`<div class="flag">Compras grandes puntuales (no se cuentan arriba): ${grandes.map(({r})=>`${esc(r.concepto)} ${money(r.monto)}`).join('; ')}. No se repiten cada mes, pero conviene planificarlas con una meta de ahorro en lugar de pagarlas con tarjeta.</div>`:''}</section>`;
  return `<section class="panel"><div class="filters">
      <div class="months" role="group" aria-label="Período">${opts.map(([v,t])=>`<button class="chip" type="button" data-catper="${v}" aria-pressed="${v===catPer}">${t}</button>`).join('')}</div>
      <label class="f" style="flex-direction:row;align-items:center;gap:6px"><span>Pagado con</span><select id="catMedio" style="width:auto">${medios.map(([v,t])=>`<option value="${v}"${v===catMedio?' selected':''}>${esc(t)}</option>`).join('')}</select></label>
      <label class="f" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="catDif" ${catDif?'checked':''} style="width:auto"> Incluir cuotas de diferidos</label></div></section>
    <section class="hero" style="margin-top:16px">
      <div class="tile key"><span class="eyebrow">Gastado${nMeses>1?' (promedio mensual)':''}</span><span class="v">${money(total/nMeses)}</span><span class="s">${totPrev===null?(nMeses>1?'Total '+money(total)+' en '+nMeses+' meses':'Primer mes con datos'):(total>=totPrev?'▲ ':'▼ ')+money(Math.abs(total-totPrev))+' frente al mes anterior'}</span></div>
      <div class="tile"><span class="eyebrow">Categoría principal</span><span class="v" style="font-size:17px">${top?esc((catById(top.id)||{nombre:top.id}).nombre):'—'}</span><span class="s">${top?money(top.total/nMeses)+' · '+pct(top.total/total)+' del total':''}</span></div>
      <div class="tile"><span class="eyebrow">Gastos hormiga</span><span class="v">${money(hormiga/nMeses)}</span><span class="s">Compras personales de hasta ${money(lim)}</span></div>
      <div class="tile"><span class="eyebrow">Evitables</span><span class="v">${money(sum(evs,x=>x.total)/nMeses)}</span><span class="s">Avances, intereses y cargos</span></div></section>
    <div class="grid2"><section class="panel"><h2>En qué gasta <small>toque una categoría para ver el detalle</small></h2><div class="catlist">${rows||'<p class="note">Sin gastos con estos filtros.</p>'}</div>
      <p class="note">${catPer==='ult3'?'Montos totales de los 3 meses; los topes se multiplican por 3.':'Comparación con '+(prevId?mesLabel(prevId):'el mes anterior (sin datos)')+'.'} Las cuotas de diferidos son pagos de compras anteriores: actívelas para ver todo lo que sale de su bolsillo.</p></section>
    <div style="display:flex;flex-direction:column;gap:16px">${det}${consejo}</div></div>`;
}

function render(){
  renderMonths();

function createMonth(id){
  const ids=Object.keys(months).sort(); const prevIds=ids.filter(x=>x<id); const base = months[prevIds[prevIds.length-1]]||{};
  const dif = (cfg.cronogramaDiferidos||{})[id] || 0;
  const pres = (cfg.plantilla||[]).filter(l=>!l.desde || l.desde<=id).filter(l=>!l.hasta || l.hasta>=id).map(l=>({...l, id:uid()}));
  pres.push({id:uid(), grupo:'diferidos', concepto:'Cuotas de diferidos de tarjetas', monto:dif, cuenta:'guayaquil', nota:dif?'Según cronograma de diferidos':'Sin cuotas en cronograma'});
  const regs = pres.filter(l=>l.grupo==='ingreso'||l.grupo==='compromiso').map(l=>({id:uid(), fecha:'', tipo: l.grupo==='ingreso'?'ingreso':'pago', concepto:l.concepto, categoria:'', medio:l.cuenta, monto:l.monto, estado:'pendiente', nota:'Creado desde la plantilla', ...(l.vinculo?{vinculo:l.vinculo}:{}), ...(l.fuente?{fuente:l.fuente}:{}), ...(l.dia?{fecha:`${id}-${String(l.dia).padStart(2,'0')}`}:{})}));
  const m = {mes:id, estado:'en curso', presupuesto:pres, registros:regs, estados:[], saldos:{...(base.saldos||{}), proyectado:true}, notas:''};
  months[id]=m; if(cfg) generarRecurrentes(m); return m;
}

  if(b.dataset.act==='edit'){ editId=b.dataset.id; render(); const el=$('a_monto'); if(el) el.scrollIntoView({block:'center'}); return; }
  if(b.id==='cancelEdit'){ editId=null; render(); return; }
  if(b.id==='genRec'){ const n=generarRecurrentes(m); render(); if(n) saveMonth(m); setStatus(n? n+' cobros recurrentes agregados como pendientes.' : 'Los cobros recurrentes ya estaban agregados.'); return; }
  if(b.id==='exportar'){ exportar(); return; }
  if(b.dataset.paytar){ sec='mov'; tab='reg'; editId=null; render(); $('a_tipo').value='pago'; $('a_concepto').value='Pago tarjeta '+medioNombre(b.dataset.paytar); $('a_monto').value=b.dataset.monto; $('a_vinc').value='tarjeta:'+b.dataset.paytar; $('a_medio').value='guayaquil'; $('a_monto').scrollIntoView({block:'center'}); return; }
  if(b.dataset.payprest){ const p=(cfg.prestamos||[]).find(x=>x.id===b.dataset.payprest); sec='mov'; tab='reg'; editId=null; render(); $('a_tipo').value='pago'; $('a_concepto').value='Cuota '+(p?p.nombre:''); $('a_monto').value=p&&p.cuota||''; $('a_vinc').value='prestamo:'+b.dataset.payprest; $('a_monto').scrollIntoView({block:'center'}); return; }
  if(b.dataset.act==='del'){ const r=m.registros.find(x=>x.id===b.dataset.id);
    if(!r._confirm){ r._confirm=true; render(); setTimeout(()=>{ if(r._confirm){ delete r._confirm; render(); }},3500); return; }
    const t=new Set([m]); if(r.estado==='hecho'){ const x=revertir(r); if(x) t.add(x); } m.registros=m.registros.filter(x=>x.id!==r.id); render(); saveSet(t); return; }
  if(b.dataset.esc){ cfg.escenario = cfg.escenario===b.dataset.esc? null : b.dataset.esc; render(); saveCfg(); }
  if(b.id==='impStop'){ imp.ctl?.abort(); return; }
  if(b.id==='impCancel'){ imp={estado:'idle',msg:''}; render(); return; }
  if(b.id==='impSave'){ guardarImport(); return; }
  if(b.dataset.sub!==undefined){ const x=cfg.suscripciones[+b.dataset.sub]; x.decision = x.decision===b.dataset.dec? '' : b.dataset.dec; render(); saveCfg(); return; }
  if(b.dataset.aportar){ const id=b.dataset.aportar; const inp=$('apt_'+id); const v=parseFloat((inp&&inp.value)||(inp&&inp.placeholder)); if(!(v>0)){ setStatus('Escriba el monto del aporte.'); return; }
    const mm=months[cur]; if(!mm){ setStatus('Elija un mes primero.'); return; } const meta=(cfg.metas||[]).find(x=>x.id===id);
    mm.registros=(mm.registros||[]).concat([{id:uid(), fecha:hoyISO(), tipo:'ahorro', concepto:'Aporte a meta: '+(meta?meta.nombre:id), categoria:'', medio:(meta&&meta.cuenta)||'guayaquil', origen:'guayaquil', monto:Math.round(v*100)/100, estado:'hecho', hechoTs:nowTs(), nota:'', meta:id}]);
    render(); saveMonth(mm); return; }
  if(b.dataset.hpre){ hPreset=b.dataset.hpre; render(); const f=$('h_monto'); if(f){ f.focus(); f.scrollIntoView({block:'center'}); } return; }
  if(b.dataset.delmeta!==undefined){ const x=cfg.metas[+b.dataset.delmeta]; if(!x._confirm){ x._confirm=true; render(); setTimeout(()=>{ if(x._confirm){ delete x._confirm; render(); } },3500); return; }
    cfg.metas.splice(+b.dataset.delmeta,1); render(); saveCfg(); return; }
  if(b.dataset.opadd!==undefined){ const p_=cfg.prestamos[+b.dataset.opadd]; const f=readBank(+b.dataset.opadd); p_._draft=f.concat([{nombre:'Operación '+(f.length+1),saldo:null,cuota:null,faltan:null}]); p_.operaciones=p_._draft; bancoAbierto=p_.id; render(); return; }
  if(b.dataset.opdel!==undefined){ const [pi,j]=b.dataset.opdel.split('|').map(Number); const p_=cfg.prestamos[pi]; const f=readBank(pi); f.splice(j,1); p_.operaciones=f; bancoAbierto=p_.id; render(); return; }
  if(b.dataset.bank!==undefined){ const pi=+b.dataset.bank; const p_=cfg.prestamos[pi]; const ops=readBank(pi).filter(o=>typeof o.saldo==='number');
    if(!ops.length){ setStatus('Escriba al menos el saldo de una operación.'); return; }
    const fecha=(document.querySelector(`.bankForm[data-pi="${pi}"] .op_fecha`)||{}).value||hoyISO();
    const saldo=Math.round(sum(ops,o=>o.saldo)*100)/100, cuota=Math.round(sum(ops,o=>o.cuota||0)*100)/100, faltan=Math.max(...ops.map(o=>o.faltan||0));
    const antes=prestamoEstado(p_).saldo;
    delete p_.operaciones; delete p_._draft; p_.monto=saldo; p_.cuota=cuota||p_.cuota; p_.cuotasTotal=faltan||p_.cuotasTotal; p_.cuotasPagadasBase=0; p_.fechaDatos=fecha;
    const r=tasaImplicita(saldo,faltan,cuota); if(r!==null) p_.tasaAnual=Math.round(r*12*10000)/10000;
    p_.primeraCuota=null; bancoAbierto=null;
    ledger.historial=(ledger.historial||[]).concat([{id:uid(), ts:nowTs(), fecha, tipo:'deuda', clave:p_.id, anterior:antes, monto:saldo, motivo:'Datos del banco: cuota normal '+cuota.toFixed(2)+', faltan '+faltan+' cuotas'}]);
    render(); saveCfg(); saveLedger(); setStatus('Préstamo actualizado al '+dmy(fecha)); return; }
  if(b.dataset.pagomes){ pagoSel=b.dataset.pagomes; render(); return; }
  if(b.id==='usarSug'){ cfg.distribucion={pct:{}}; const mm=months[cur]; const c=calc(mm), P=mm.presupuesto||[];
    const fijo=k=>sum(P.filter(l=>l.grupo!=='ingreso'&&l.cuenta===k),l=>l.monto); const resto=c.ingresoPres-fijo('produbanco')-fijo('austro')-c.split.abono;
    const nec={guayaquil:fijo('guayaquil'),pichincha:c.split.personal+fijo('pichincha'),internacional:c.split.fondo+fijo('internacional')};
    Object.entries(nec).forEach(([k,v])=>cfg.distribucion.pct[k]=resto>0?Math.round(v/resto*1000)/10:0); render(); saveCfg(); return; }
  if(b.id==='limpiarPct'){ cfg.distribucion={pct:{}}; render(); saveCfg(); return; }
  if(b.id==='closeMonth'){ if(m.estado!=='cerrado'){ const d=deudaActual(); const din=dineroCuentas(); m.saldos={...(m.saldos||{}), total:Math.round(d.total*100)/100, completa:d.completa, tarjetas:Math.round(d.tarjetas*100)/100, prestamos:Math.round(d.prestamos*100)/100, cuentas:din.n?Math.round(din.total*100)/100:null, fechaCierre:hoyISO(), proyectado:false}; m.estado='cerrado'; } else m.estado='en curso'; render(); saveMonth(m); }
});
document.addEventListener('input', e=>{
  const t=e.target; const map={nm_nombre:'nombre',nm_monto:'monto',nm_cuota:'cuota',nm_fecha:'fecha'};
  if(map[t.id]){ nm[map[t.id]]=t.value; const el=$('nmPrev'); if(el) el.innerHTML=vistaRecom(); }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('.bub')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); } if(e.key==='Escape' && aSheet){ aSheet=null; render(); } });
document.addEventListener('change', e=>{
  if(e.target.id==='aImport'){ const f=e.target.files&&e.target.files[0]; if(!f) return; f.text().then(t=>{ let j=null; try{ j=JSON.parse(t); }catch(_){}
      if(!j || j.app!=='mis-finanzas' || !j.docs || !j.docs['config/main']){ toast('Ese archivo no es un respaldo de Mis finanzas'); return; } aImp=j; aSheet='import'; render(); }); return; }
  if(e.target.id==='catMedio'){ catMedio=e.target.value; catSel=null; render(); return; }
  if(e.target.id==='catDif'){ catDif=e.target.checked; render(); return; }
  if(e.target.dataset && e.target.dataset.recat){ const m=months[e.target.dataset.recmes]; const r=m&&(m.registros||[]).find(x=>x.id===e.target.dataset.recat); if(r){ r.categoria=e.target.value; render(); saveMonth(m); setStatus('Categoría actualizada.'); } return; }
  if(e.target.id==='nm_modo'){ nm.modo=e.target.value; render(); return; }
  if(e.target.id==='nm_cuenta'){ nm.cuenta=e.target.value; return; }
  if(e.target.id==='nm_fecha' || e.target.id==='nm_nombre' || e.target.id==='nm_monto' || e.target.id==='nm_cuota') return;
  if(e.target.id==='h_clave' || e.target.id==='h_fecha' || e.target.id==='h_monto' || e.target.id==='h_motivo') return;
  if(e.target.closest && e.target.closest('.bankForm')) return;
  const t=e.target, m=months[cur]; const val = t.value===''? null : Math.round(parseFloat(t.value)*100)/100;
  if(t.id==='fTipo'){ fTipo=t.value; render(); return; }
  if(t.id==='fCat'){ fCat=t.value; render(); return; }
  if(t.dataset.pres){ const l=m.presupuesto.find(x=>x.id===t.dataset.pres); l.monto=val??0; render(); saveMonth(m); }
  else if(t.dataset.pag!==undefined){ m.estados[+t.dataset.pag].pagado=val; render(); saveMonth(m); }
  else if(t.dataset.fpag!==undefined){ m.estados[+t.dataset.fpag].fechaPagado=t.value||null; render(); saveMonth(m); }
  else if(t.id==='proy'){ m.saldos=m.saldos||{}; m.saldos.proyectado=t.checked; render(); saveMonth(m); }
  else if(t.id==='notas'){ m.notas=t.value; saveMonth(m); }
  else if(t.dataset.app){ cfg.deudaApp=cfg.deudaApp||{}; cfg.deudaApp[pagoSel]=cfg.deudaApp[pagoSel]||{}; if(val===null) delete cfg.deudaApp[pagoSel][t.dataset.app]; else cfg.deudaApp[pagoSel][t.dataset.app]=val; render(); saveCfg(); }
  else if(t.dataset.pct){ cfg.distribucion=cfg.distribucion||{pct:{}}; cfg.distribucion.pct=cfg.distribucion.pct||{}; if(val===null) delete cfg.distribucion.pct[t.dataset.pct]; else cfg.distribucion.pct[t.dataset.pct]=val; render(); saveCfg(); }
  else if(t.id==='metaFondo'){ cfg.metaFondo=val||1275; render(); saveCfg(); }
  else if(t.id==='impFile'){ const f=t.files&&t.files[0]; if(f) importar(f); }
  else if(t.id==='impMov'){ imp.conMov=t.checked; }
  else if(t.id==='umbral'){ cfg.umbralHormiga=val??15; render(); saveCfg(); }
  else if(t.dataset.mm){ const x=cfg.metas[+t.dataset.i]; const k=t.dataset.mm;
    x[k] = (k==='fechaObjetivo'||k==='cuenta') ? (t.value||null) : (k==='cuotaFija' ? val : (val||0)); render(); saveCfg(); }
  else if(t.dataset.pr!==undefined){ const p_=cfg.prestamos[+t.dataset.pr]; const k=t.dataset.k; p_[k] = k==='primeraCuota' ? (t.value||null) : val; render(); saveCfg(); }
  else if(t.dataset.tope){ const k=cats().find(x=>x.id===t.dataset.tope); k.tope=val??0; render(); saveCfg(); }
  else if(t.id==='adelSel'){ cfg.adelanto={sel:t.value}; render(); saveCfg(); }
  else if(t.dataset.adel){ cfg.adelanto=cfg.adelanto||{}; cfg.adelanto[t.dataset.adel]=val; render(); saveCfg(); }
  else if(t.dataset.refi){ cfg.refinanciamiento=cfg.refinanciamiento||{}; cfg.refinanciamiento[t.dataset.refi]=val; render(); saveCfg(); }
});

// ---------- boot
render();
(async()=>{
  try{ db = await (window.claude && window.claude.use ? window.claude.use('db') : null); }catch(_){ db=null; }
  if(!db && !window.claude){ db=localDB(); setTimeout(()=>{ if(syncOn()) syncPull(false); }, 1200); try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(_){} }
  try{ window.claude?.use?.('sample')?.then(f=>{ sampleFn=f||null; if(tab==='tar') render(); }).catch(()=>{}); }catch(_){}
  try{ window.claude?.use?.('downloads')?.then(f=>{ dlFn=f||null; }).catch(()=>{}); }catch(_){}
  if(!db){ setStatus('Base de datos no disponible en esta vista.'); render(); return; }
  db.doc('ledger/main').onSnapshot(sn=>{ ledger = sn.exists? JSON.parse(JSON.stringify(sn.data())) : {historial:[]}; if(!ledger.historial) ledger.historial=[]; render(); }, err=>setStatus('Conexión interrumpida ('+err.code+').'));
  db.doc('config/main').onSnapshot(s=>{ cfg = s.exists? JSON.parse(JSON.stringify(s.data())) : null; setStatus(cfg?'Datos sincronizados':'Sin datos todavía'); render(); }, err=>setStatus('Conexión interrumpida ('+err.code+'). Recargue la página.'));
  db.collection('months').onSnapshot(q=>{
    const next={}; q.docs.forEach(d=>{ next[d.id]=JSON.parse(JSON.stringify(d.data())); });
    months=next; const ids=Object.keys(months).sort();
    if(!cur || !months[cur]) cur = ids.find(i=>months[i].estado!=='cerrado') || ids[ids.length-1] || null;
    render();
  }, err=>setStatus('Conexión interrumpida ('+err.code+'). Recargue la página.'));
})();
})();
</script>
